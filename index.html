<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ===== SEO ===== -->
    <title>Kavin Jayanth S RPA Developer</title>
    <meta
      name="description"
      content="Kavin Jayanth is an RPA and Automation Developer at Cognizant with 2+ years of experience in UiPath, Automation Anywhere 360, Power Platform and AI-based automation. Based in Chennai, India."
    />
    <meta
      name="keywords"
      content="Kavin Jayanth, RPA Developer, Automation Developer, UiPath, Automation Anywhere 360, Power Automate, Python, Azure AI, Chennai, Cognizant"
    />
    <meta name="author" content="Kavin Jayanth" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#050506" />
    <!-- TODO: replace with your real production URL after deploying -->
    <link rel="canonical" href="https://your-domain.vercel.app/" />

    <!-- ===== Open Graph / Twitter ===== -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kavin Jayanth | RPA Developer" />
    <meta
      property="og:description"
      content="Portfolio of Kavin Jayanth: RPA, Power Platform and AI-based automation projects, skills and experience."
    />
    <meta property="og:url" content="https://your-domain.vercel.app/" />
    <meta property="og:image" content="https://your-domain.vercel.app/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kavin Jayanth | RPA Developer &amp; Automation Developer" />
    <meta
      name="twitter:description"
      content="RPA, Power Platform and AI-based automation projects, skills and experience."
    />
    <meta name="twitter:image" content="https://your-domain.vercel.app/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- ===== Fonts (display=swap keeps text visible while loading) ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- ===== Structured data ===== -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Kavin Jayanth",
        "jobTitle": "RPA Developer",
        "worksFor": { "@type": "Organization", "name": "Cognizant" },
        "address": { "@type": "PostalAddress", "addressLocality": "Chennai", "addressCountry": "IN" },
        "url": "https://your-domain.vercel.app/",
        "sameAs": [
          "https://www.linkedin.com/in/your-profile",
          "https://github.com/your-username"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This portfolio needs JavaScript enabled to display its content.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
